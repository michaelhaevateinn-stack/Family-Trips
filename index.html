<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f5ef"><title>Family Trips</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#29352f;background:#f8f5ef}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;background:#f8f5efed;backdrop-filter:blur(12px);border-bottom:1px solid #e7e3dc}.wrap{max-width:780px;margin:auto;padding:18px 18px 90px}.head{max-width:780px;margin:auto;padding:18px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:22px;letter-spacing:-.7px}.sub{font-size:12px;color:#798078}.pill{display:inline-block;background:#edf0e9;color:#526755;border-radius:20px;padding:5px 10px;font-size:12px}.primary{background:#416b56;color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:700}.secondary{background:#fff;border:1px solid #dddcd5;color:#35473b;border-radius:12px;padding:10px 13px}.danger{color:#a64747}.toolbar{display:flex;gap:9px;margin:16px 0}.toolbar input{flex:1;min-width:0}.field{width:100%;background:white;border:1px solid #dfdfd7;border-radius:12px;padding:12px;color:#29352f}.grid{display:grid;gap:12px}.trip{background:#fff;border:1px solid #e8e6e0;border-radius:17px;padding:18px;text-align:left;width:100%;box-shadow:0 3px 14px #263f2907}.trip h3{font-size:17px;margin:8px 0}.trip p{font-size:13px;line-height:1.7;color:#6a756c;margin:7px 0 0}.muted{color:#7a837b;font-size:12px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.tabs{display:flex;gap:5px;background:#ebece6;padding:5px;border-radius:12px;margin:20px 0}.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:9px;flex:1;color:#647167}.tabs button.active{background:#fff;color:#2b4936;box-shadow:0 1px 5px #0001;font-weight:700}.paper{white-space:pre-wrap;line-height:1.85;font-size:14px;background:#fff;padding:18px;border:1px solid #e8e6e0;border-radius:14px;overflow-wrap:anywhere}.label{display:block;font-weight:700;font-size:13px;margin:17px 0 7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.hide{display:none!important}.empty{text-align:center;padding:45px 10px;color:#7d877e}.small{font-size:12px;line-height:1.7;color:#7b847a}.back{border:0;background:none;color:#416b56;font-weight:700;padding:6px 0 14px}textarea{min-height:135px;resize:vertical}a{color:#386b51}footer{margin-top:25px;color:#7a837b;font-size:12px;line-height:1.7}.notice{padding:12px;border-radius:12px;background:#eef3ed;font-size:12px;line-height:1.7}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}@media(min-width:650px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="head"><div><div class="brand">Family Trips <span style="font-size:20px">✿</span></div><div class="sub">家族のおでかけ記録</div></div><button class="primary" id="add">＋ 新規</button></div></header><main class="wrap"><section id="home"><div class="toolbar"><input id="search" class="field" placeholder="旅程・メモを全文検索"><select id="filter" class="field" style="flex:0 0 112px"><option value="all">すべて</option><option value="planned">計画中</option><option value="record">記録</option></select></div><div class="muted" id="count"></div><div id="list" class="grid" style="margin-top:12px"></div><div class="actions"><button class="secondary" id="export">データをバックアップ</button><button class="secondary" id="import">バックアップを読み込む</button><input type="file" accept="application/json,.json" id="file" hidden></div><div class="notice">データはこの端末のブラウザ内に保存されます。まだ夫婦間の自動同期はありません。端末変更やブラウザデータ消去に備え、定期的にJSONをiCloud Driveへ保存してください。</div></section><section id="detail" class="hide"><button class="back" id="back">← 一覧に戻る</button><div class="muted" id="dateText"></div><h2 id="detailTitle" style="margin:9px 0"></h2><span class="pill" id="statusText"></span><div class="tabs"><button data-tab="summary" class="active">整理版</button><button data-tab="raw">元メモ</button><button data-tab="photos">写真・リンク</button></div><div id="summaryPanel"><div class="paper" id="summaryText"></div></div><div id="rawPanel" class="hide"><div class="paper" id="rawText"></div></div><div id="photosPanel" class="hide"><div class="paper"><div style="font-weight:700;margin-bottom:12px">LINEアルバム・共有写真</div><div id="albumView"></div><p class="small">iPhoneの「写真」アプリの特定日付をWebアプリから直接開くことはできません。日付をコピーして写真アプリで検索してください。</p><button class="secondary" id="copyDate">旅程の日付をコピー</button></div></div><div class="actions"><button class="primary" id="edit">編集する</button><button class="secondary" id="duplicate">この旅程を複製</button></div></section><section id="editor" class="hide"><button class="back" id="cancel">← 戻る</button><h2 id="editorTitle">旅程を編集</h2><label class="label">タイトル</label><input id="fTitle" class="field"><div class="row"><div><label class="label">開始日</label><input id="fStart" type="text" class="field" placeholder="2026-11-27 / 2023-09"></div><div><label class="label">終了日（任意）</label><input id="fEnd" type="text" class="field" placeholder="2026-11-28"></div></div><label class="label">状態</label><select id="fStatus" class="field"><option>計画中</option><option>計画メモ</option><option>記録</option><option>日付未設定</option></select><label class="label">整理版（ゲボラが整えた文章）</label><textarea id="fSummary" class="field" style="min-height:220px"></textarea><label class="label">元メモ（原文をそのまま）</label><textarea id="fRaw" class="field" style="min-height:260px"></textarea><label class="label">追記メモ</label><textarea id="fNotes" class="field" placeholder="当日の気づき、次回へのメモなど"></textarea><label class="label">LINEアルバム・共有リンク</label><input id="fAlbum" type="url" class="field" placeholder="https://..."><div class="actions"><button class="primary" id="save">保存</button><button class="secondary danger" id="remove">削除</button></div><p class="small">入力内容は「保存」で確定します。編集途中の自動保存はまだありません。</p></section><footer>Family Trips v1.0 · オフライン保存版 · Firebase共有は後日対応</footer></main><script src="initial_data.js"></script><script>
(()=>{'use strict';const KEY='family-trips-v1';let trips=[],selected=null,editing=null,tab='summary';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stamp=s=>s||'日付未設定';const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(trips));return true}catch(e){alert('保存できませんでした。ストレージの空き容量を確認してください。');return false}};try{let saved=localStorage.getItem(KEY);trips=saved?JSON.parse(saved):structuredClone(window.INITIAL_TRIPS||[]);if(!saved)persist()}catch(e){trips=structuredClone(window.INITIAL_TRIPS||[])}function show(which){['home','detail','editor'].forEach(id=>$(id).classList.toggle('hide',id!==which));scrollTo(0,0)}function draw(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value;let arr=trips.filter(t=>(f==='all'||(f==='planned'?t.status==='計画中':t.status==='記録'))&&[t.title,t.summary,t.raw,t.notes,t.start].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>String(b.start).localeCompare(String(a.start)));$('count').textContent=`${arr.length}件の旅程 ／ 全${trips.length}件`;$('list').innerHTML=arr.length?arr.map(t=>`<button class="trip" data-id="${esc(t.id)}"><div class="topline"><span class="muted">${esc(stamp(t.start))}${t.end&&t.end!==t.start?' 〜 '+esc(t.end):''}</span><span class="pill">${esc(t.status)}</span></div><h3>${esc(t.title)}</h3><p>${esc(t.summary).slice(0,105)}${t.summary.length>105?'…':''}</p></button>`).join(''):'<div class="empty">該当する旅程はありません</div>';document.querySelectorAll('.trip').forEach(el=>el.onclick=()=>openTrip(el.dataset.id))}function openTrip(id){selected=id;const t=trips.find(x=>x.id===id);if(!t)return;$('dateText').textContent=stamp(t.start)+(t.end&&t.end!==t.start?' 〜 '+t.end:'');$('detailTitle').textContent=t.title;$('statusText').textContent=t.status;$('summaryText').textContent=t.summary+(t.notes?'\n\n【追記メモ】\n'+t.notes:'');$('rawText').textContent=t.raw||'元メモなし';let u=t.album||'';let safe=/^https:\/\//i.test(u);$('albumView').innerHTML=safe?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">アルバムを開く ↗</a>`:'<span class="muted">リンク未登録（編集画面から追加できます）</span>';setTab('summary');show('detail')}function setTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['summary','raw','photos'].forEach(x=>$(x+'Panel').classList.toggle('hide',x!==name))}function editTrip(id){editing=id;let t=trips.find(x=>x.id===id)||{title:'',start:'',end:'',status:'計画中',summary:'',raw:'',notes:'',album:''};$('editorTitle').textContent=id?'旅程を編集':'新しい旅程';for(let [f,k] of [['fTitle','title'],['fStart','start'],['fEnd','end'],['fStatus','status'],['fSummary','summary'],['fRaw','raw'],['fNotes','notes'],['fAlbum','album']])$(f).value=t[k]||'';$('remove').classList.toggle('hide',!id);show('editor')}function getForm(){return{title:$('fTitle').value.trim(),start:$('fStart').value.trim(),end:$('fEnd').value.trim(),status:$('fStatus').value,summary:$('fSummary').value,raw:$('fRaw').value,notes:$('fNotes').value,album:$('fAlbum').value.trim()}}$('add').onclick=()=>editTrip(null);$('back').onclick=()=>{show('home');draw()};$('cancel').onclick=()=>editing?openTrip(editing):show('home');$('edit').onclick=()=>editTrip(selected);$('save').onclick=()=>{let form=getForm();if(!form.title)return alert('タイトルを入力してください');if(form.album&&!/^https:\/\//i.test(form.album))return alert('アルバムはhttps://で始まるURLを入力してください');if(editing){let i=trips.findIndex(t=>t.id===editing);if(i<0)return;trips[i]={...trips[i],...form};selected=editing}else{selected='trip-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);trips.push({id:selected,...form})}if(persist())openTrip(selected)};$('remove').onclick=()=>{if(!confirm('この旅程を削除しますか？'))return;trips=trips.filter(t=>t.id!==editing);if(persist()){show('home');draw()}};$('duplicate').onclick=()=>{let t=trips.find(x=>x.id===selected);if(!t)return;editTrip(null);$('fTitle').value=t.title+'（コピー）';$('fSummary').value=t.summary;$('fRaw').value=t.raw;$('fNotes').value=t.notes||'';$('fAlbum').value=t.album||''};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('search').oninput=draw;$('filter').onchange=draw;$('copyDate').onclick=async()=>{let t=trips.find(x=>x.id===selected);let s=stamp(t.start)+(t.end&&t.end!==t.start?' 〜 '+t.end:'');try{await navigator.clipboard.writeText(s);alert('日付をコピーしました')}catch(e){prompt('日付をコピーしてください',s)}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Family Trips',version:1,exportedAt:new Date().toISOString(),trips},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='family_trips_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());let rows=Array.isArray(parsed)?parsed:parsed.trips;if(!Array.isArray(rows)||!rows.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'))throw Error('形式が違います');if(!confirm(`バックアップの${rows.length}件で現在の${trips.length}件を置き換えます。続けますか？`))return;let old=trips;trips=rows;if(persist()){draw();alert('読み込みました')}else trips=old}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}};draw()})();
</script></body></html>
