ansform .2s}.trip:active{transform:scale(.985)}.cover{height:210px;position:relative;overflow:hidden;background:linear-gradient(125deg,#557d7a,#9eb6a3 50%,#d5b79b)}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#10292380);pointer-events:none}.cover .corner{position:absolute;z-index:1;left:15px;top:15px;background:#fffef1ed;border-radius:30px;padding:6px 11px;font-size:11px;font-weight:800}.cover .fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:68px;opacity:.7}.cover .date{position:absolute;bottom:14px;left:17px;color:white;z-index:1;font-size:12px;font-weight:800}.tripbody{padding:17px 18px 20px}.tripbody h2{font-size:20px;line-height:1.45;margin:0 0 7px;letter-spacing:-.5px}.tripbody p{font-size:12px;color:#687873;line-height:1.8;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}.tag{font-size:10px;background:#edf4ee;color:#527168;border-radius:20px;padding:5px 9px;font-weight:700}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.detail{display:none}.back{border:0;background:none;font-size:13px;color:var(--accent);font-weight:800;padding:5px 0 20px}.hero{position:relative;min-height:280px;border-radius:24px;overflow:hidden;background:linear-gradient(120deg,#527d78,#c2b49b);display:flex;align-items:flex-end}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,#132e2bd9)}.heroContent{position:relative;z-index:1;padding:28px;color:white}.heroContent h1{font-size:clamp(25px,5vw,40px);margin:8px 0;line-height:1.3}.heroContent p{margin:0;font-size:12px;opacity:.9}.detailbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.panel{background:white;border:1px solid #ebe8e1;border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 5px 25px #34433d09}.panel h2{font-size:20px;margin:0 0 15px}.lead{font-size:15px;line-height:2;color:#465b54}.day{border-radius:20px;background:#fff;border:1px solid #ece9e3;overflow:hidden;margin:18px 0}.dayhead{background:linear-gradient(105deg,#24534b,#3d8777);padding:19px 20px;color:white}.dayhead small{font-size:10px;letter-spacing:2px;opacity:.75;font-weight:800}.dayhead h3{margin:5px 0 0;font-size:19px}.timeline{padding:18px 20px}.event{position:relative;border-left:2px solid #d7e7dd;padding:0 0 22px 21px;margin-left:8px}.event:last-child{padding-bottom:0;border-color:transparent}.event:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#d4a168;border:2px solid white;box-shadow:0 0 0 1px #d4a168}.event time{display:inline-block;background:#f4eadd;color:#a3763c;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;margin-bottom:6px}.event strong{display:block;font-size:14px;line-height:1.8}.sectionline{font-size:13px;line-height:2;white-space:pre-wrap}.raw{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;color:#53645d;font-size:13px}.link{display:inline-flex;align-items:center;gap:5px;padding:10px 13px;background:#f2f8f5;border-radius:10px;margin:4px 6px 4px 0;text-decoration:none;font-weight:700;font-size:12px}.muted{color:var(--muted);font-size:12px;line-height:1.8}.editor{display:none;position:fixed;inset:0;background:#172e2ba8;z-index:10;overflow:auto;padding:18px}.dialog{background:#fffdf9;border-radius:22px;max-width:680px;margin:20px auto;padding:24px}.dialog h2{margin:0 0 16px}.field{display:block;margin:13px 0;font-size:12px;font-weight:800}.field input,.field textarea,.field select{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d9ddd6;border-radius:10px;background:white;color:var(--ink)}.field textarea{min-height:110px;line-height:1.7}.hint{font-size:11px;color:#788680;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b4d43;color:white;padding:12px 18px;border-radius:12px;z-index:20;display:none;max-width:90%;text-align:center;font-size:13px}.foot{font-size:11px;text-align:center;color:#9a9e96;padding:35px}.photoCredit{font-size:10px;color:#8d948f;margin-top:8px}.note{border-left:3px solid #e4b97a;background:#fff8ee;padding:12px 15px;border-radius:0 10px 10px 0;line-height:1.8;font-size:13px}@media(max-width:650px){.cards{grid-template-columns:1fr}.cover{height:220px}.head{padding:12px 16px}.brand strong{font-size:21px}.container{padding:12px 14px 60px}.panel{padding:17px}.hero{min-height:245px}.heroContent{padding:21px}.actions .btn{padding:9px}.intro{padding:20px 4px 12px}}
</style></head><body><header><div class="head"><div class="brand"><small>OUR FAMILY JOURNAL</small><strong>Family Trips <span style="color:#d3a064">✦</span></strong></div><div class="actions"><button class="btn" id="backupBtn">⚙ データ</button><button class="btn primary" id="addBtn">＋ 追加</button></div></div></header><main class="container"><section id="home"><div class="intro"><div class="kicker">MEMORIES & ADVENTURES</div><h1>家族の旅を、<br>何度でも楽しもう。</h1><p>お出かけの予定も、あの日の思い出も。<br>家族の小さな冒険を、一冊の旅のアルバムに。</p></div><input id="search" class="search" placeholder="⌕ 旅行先・思い出・元メモから探す"><div class="filters" id="filters"></div><div id="count" class="muted" style="margin-bottom:12px"></div><div id="cards" class="cards"></div></section><section id="detail" class="detail"></section><div class="foot">Family Trips · Made for our family ♡</div></main><div id="editor" class="editor"><div class="dialog"><div class="row" style="justify-content:space-between"><h2>旅程を編集</h2><button class="btn" onclick="closeEditor()">閉じる ✕</button></div><form id="editForm"><label class="field">タイトル<input id="eTitle" required></label><div class="row"><label class="field" style="flex:1">開始日<input id="eStart" placeholder="2025-09-09"></label><label class="field" style="flex:1">終了日<input id="eEnd" placeholder="2025-09-11"></label></div><label class="field">分類（複数選択）<div id="eCats" class="row" style="margin-top:9px"></div></label><label class="field">表紙写真をiPhoneから選ぶ<input type="file" accept="image/*" id="ePhoto"></label><p class="hint">写真は端末内で縮小して保存。大きすぎる写真は自動圧縮します。ほかの端末には同期されません。</p><label class="field">または写真のURL<input id="eCover" type="url" placeholder="https://..."></label><label class="field">写真の出典・クレジット<input id="eCredit" placeholder="撮影者 / サイト名など"></label><label class="field">旅の紹介文<textarea id="eSummary"></textarea></label><label class="field">旅程（1行ずつ。先頭に時刻があればタイムライン表示）<textarea id="eItinerary" rows="9"></textarea></label><p class="hint">日ごとの区切りは「# 9月9日｜大阪へ」のように # を付けます。</p><label class="field">当日の思い出・エピソード<textarea id="eMemory"></textarea></label><label class="field">元メモ（そのまま保管）<textarea id="eRaw" rows="6"></textarea></label><label class="field">公式サイト等のリンク（1行に「名前 | URL」）<textarea id="eLinks" rows="3"></textarea></label><label class="field">LINE・写真アルバムURL<input id="eAlbum" type="url" placeholder="https://..."></label><label class="field">状態<select id="eStatus"><option>記録</option><option>計画中</option><option>計画メモ</option><option>日付未設定</option></select></label><div class="row" style="justify-content:space-between;margin-top:22px"><button class="btn" type="button" id="deleteBtn">削除</button><button class="btn primary" type="submit">保存する</button></div></form></div></div><div id="toast" class="toast"></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"><script>
const KEY='familyTripsDataV11',KEY2='familyTripsDataV2',CATS=['ディズニー','テーマパーク','祖父母・親戚','旅行・観光','お出かけ','家族イベント'];
const emoji={'ディズニー':'🏰','テーマパーク':'🎢','祖父母・親戚':'🏡','旅行・観光':'🧳','お出かけ':'🌿','家族イベント':'🎉'};
const palettes=[['#286c7d','#b1c8bc','#e6c9a2'],['#5c6d9e','#c6b3cb','#e2b09d'],['#6c876c','#e0c7a2','#a4b2ad'],['#6b7e9c','#a6b9c9','#e2c1a7']];
let trips=[],active='すべて',selected=null,editing=null,uploaded=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3200)}
function dateLabel(t){let d=t.start||'';if(!d)return '日付未設定';if(d.length===7)return d.replace('-','年')+'月';return d.replaceAll('-','.').replace(/^(\d{4})\.(\d{2})\.(\d{2})$/,(_,y,m,dd)=>`${y}.${m}.${dd}`)+(t.end&&t.end!==t.start?' — '+t.end.slice(5).replace('-','.'):'')}
function normalize(t){return {...t,categories:Array.isArray(t.categories)?t.categories:[t.category||'旅行・観光'],sections:(t.sections||[]).map(s=>({title:s.title||'旅程',items:(s.items||[]).map(x=>typeof x==='string'?{time:'',text:x}:x)})),links:t.links||[],memory:t.memory||'',cover:t.cover||'',coverCredit:t.coverCredit||''}}
function save(){try{localStorage.setItem(KEY2,JSON.stringify(trips));return true}catch(e){toast('保存容量が不足しています。写真を小さくするかバックアップしてください');return false}}
function load(){let v=localStorage.getItem(KEY2);if(v){try{trips=JSON.parse(v).map(normalize);return}catch(e){}}let old=localStorage.getItem(KEY);if(old){try{trips=JSON.parse(old).map(normalize);save();return}catch(e){}}trips=[]}
function coverHTML(t,hero=false){let c=t.cover||t.photoUrl||'';let i=trips.indexOf(t);let colors=palettes[(i<0?0:i)%palettes.length];let style=`background:linear-gradient(125deg,${colors.join(',')})`;let icon=emoji[t.categories?.[0]]||'✈️';return `<div class="${hero?'hero':'cover'}" style="${style}">${c?`<img src="${esc(c)}" alt="" loading="lazy" onerror="this.style.display='none'">`:`<span class="fallback" aria-hidden="true">${icon}</span>`}${hero?'':`<span class="corner">${esc(t.status||'記録')}</span><span class="date">${esc(dateLabel(t))}</span>`}${hero?`<div class="heroContent"><div style="font-size:12px;font-weight:800;letter-spacing:2px">${esc(dateLabel(t))}</div><h1>${esc(t.title)}</h1><p>${esc(t.categories.join(' · '))}</p></div>`:''}</div>`}
function render(){let q=$('#search').value.trim().toLowerCase();$('#filters').innerHTML=['すべて',...CATS].map(c=>`<button class="chip ${active===c?'active':''}" data-cat="${esc(c)}">${c==='すべて'?'すべて':(emoji[c]||'')+' '+c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});let list=trips.filter(t=>(active==='すべて'||t.categories.includes(active))&&[t.title,t.summary,t.raw,t.memory,t.categories.join(' '),JSON.stringify(t.sections)].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.start||'').localeCompare(a.start||''));$('#count').textContent=`${list.length} TRIPS`;$('#cards').innerHTML=list.length?list.map(t=>`<article class="trip" tabindex="0" role="button" data-id="${esc(t.id)}">${coverHTML(t)}<div class="tripbody"><h2>${esc(t.title)}</h2><p>${esc(t.summary)}</p><div class="tags">${t.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></div></article>`).join(''):'<div class="empty">まだ旅程がありません。<br>「＋ 追加」または「⚙ データ」から読み込んでね。</div>';document.querySelectorAll('.trip').forEach(el=>{el.onclick=()=>openTrip(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')openTrip(el.dataset.id)}})}
function openTrip(id){let t=trips.find(x=>x.id===id);if(!t)return;selected=id;$('#home').style.display='none';$('#detail').style.display='block';let sections=t.sections||[];$('#detail').innerHTML=`<button class="back" id="back">← 旅の一覧へ</button>${coverHTML(t,true)}${t.coverCredit?`<div class="photoCredit">写真：${esc(t.coverCredit)}</div>`:''}<div class="detailbar"><button class="btn primary" id="edit">✎ 編集・写真変更</button><button class="btn" id="copy">⧉ 複製</button></div><div class="panel"><div class="kicker">ABOUT THIS TRIP</div><h2>旅のハイライト ✨</h2><div class="lead">${esc(t.summary||'これから旅の思い出を追加しよう。')}</div><div class="tags">${t.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></div><div class="kicker" style="margin:25px 4px 8px">OUR ITINERARY</div><h2 style="margin:0 4px 15px">旅のスケジュール 🗓️</h2>${sections.length?sections.map((s,i)=>`<section class="day"><div class="dayhead"><small>DAY ${String(i+1).padStart(2,'0')}</small><h3>${esc(s.title)}</h3></div><div class="timeline">${(s.items||[]).map(it=>{let tx=it.text||'';let time=it.time||'';if(!time){let m=tx.match(/^(?:([01]?\d|2[0-3]):[0-5]\d|(?:[01]?\d|2[0-3])時(?:半)?)/);if(m)time=m[0]}return `<div class="event">${time?`<time>${esc(time)}</time>`:''}<strong>${esc(tx)}</strong></div>`}).join('')}</div></section>`).join(''):'<div class="panel muted">旅程はまだ登録されていません。</div>'}${t.memory?`<div class="panel"><h2>💛 あの日の思い出</h2><div class="sectionline">${esc(t.memory)}</div></div>`:''}<div class="panel"><h2>🔗 施設・写真リンク</h2>${t.links.filter(l=>/^https?:\/\//.test(l.url||'')).map(l=>`<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">↗ ${esc(l.label||'公式サイト')}</a>`).join('')}${/^https?:\/\//.test(t.album||'')?`<a class="link" href="${esc(t.album)}" target="_blank" rel="noopener noreferrer">📷 写真アルバム</a>`:''}${!(t.links.length||t.album)?'<div class="muted">リンクは編集から追加できます。</div>':''}</div><details class="panel"><summary style="cursor:pointer;font-weight:800">📜 元メモを表示する</summary><div class="raw" style="margin-top:18px">${esc(t.raw||'')}</div></details><div class="note">📝 予定と当日の記録は、元メモに書かれた範囲で整理しています。実際に行ったか不明な予定は、実績として断定しません。</div>`;$('#back').onclick=goHome;$('#edit').onclick=()=>openEditor(id);$('#copy').onclick=()=>{let n=JSON.parse(JSON.stringify(t));n.id='trip-'+Date.now();n.title+='（コピー）';trips.unshift(n);if(save()){openTrip(n.id);toast('旅程を複製しました')}};window.scrollTo(0,0)}
function goHome(){selected=null;$('#detail').style.display='none';$('#home').style.display='block';render();window.scrollTo(0,0)}
function sectionText(t){return (t.sections||[]).map(s=>'# '+s.title+'\n'+(s.items||[]).map(i=>i.text||i).join('\n')).join('\n\n')}
function parseSections(str){let sections=[],s=null;for(let line of str.split('\n')){line=line.trim();if(!line)continue;if(line.startsWith('#')){s={title:line.replace(/^#+\s*/,'')||'旅程',items:[]};sections.push(s)}else{if(!s){s={title:'当日の旅程',items:[]};sections.push(s)}let m=line.match(/^(?:([01]?\d|2[0-3]):[0-5]\d|(?:[01]?\d|2[0-3])時(?:半)?)/);s.items.push({time:m?m[0]:'',text:line})}}return sections}
function openEditor(id){editing=id;uploaded=null;let t=trips.find(x=>x.id===id)||{title:'',start:'',end:'',categories:['旅行・観光'],summary:'',sections:[],memory:'',raw:'',links:[],album:'',status:'計画中',cover:'',coverCredit:''};$('#eTitle').value=t.title;$('#eStart').value=t.start||'';$('#eEnd').value=t.end||'';$('#eSummary').value=t.summary||'';$('#eItinerary').value=sectionText(t);$('#eMemory').value=t.memory||'';$('#eRaw').value=t.raw||'';$('#eLinks').value=(t.links||[]).map(l=>l.label+' | '+l.url).join('\n');$('#eAlbum').value=t.album||'';$('#eCover').value=t.cover?.startsWith('data:')?'':t.cover||'';$('#eCredit').value=t.coverCredit||'';$('#eStatus').value=t.status||'記録';$('#ePhoto').value='';$('#eCats').innerHTML=CATS.map(c=>`<label style="font-size:12px;font-weight:600"><input type="checkbox" value="${esc(c)}" ${t.categories.includes(c)?'checked':''}> ${c}</label>`).join('');$('#deleteBtn').style.display=id?'':'none';$('#editor').style.display='block'}
function closeEditor(){$('#editor').style.display='none'}
$('#editForm').onsubmit=e=>{e.preventDefault();let t=trips.find(x=>x.id===editing);let obj={...(t||{}),id:editing||'trip-'+Date.now(),title:$('#eTitle').value.trim(),start:$('#eStart').value.trim(),end:$('#eEnd').value.trim(),summary:$('#eSummary').value.trim(),categories:[...$('#eCats').querySelectorAll('input:checked')].map(x=>x.value),sections:parseSections($('#eItinerary').value),memory:$('#eMemory').value,raw:$('#eRaw').value,links:$('#eLinks').value.split('\n').map(x=>{let a=x.split('|');return {label:(a[0]||'').trim(),url:(a.slice(1).join('|')||'').trim()}}).filter(x=>/^https?:\/\//.test(x.url)),album:$('#eAlbum').value.trim(),status:$('#eStatus').value,cover:uploaded||$('#eCover').value.trim()||((t?.cover||'').startsWith('data:')?t.cover:''),coverCredit:$('#eCredit').value.trim()};if(!obj.categories.length)obj.categories=['旅行・観光'];let ix=trips.findIndex(x=>x.id===obj.id);if(ix<0)trips.unshift(obj);else trips[ix]=obj;if(save()){closeEditor();openTrip(obj.id);toast('保存しました')}};
$('#deleteBtn').onclick=()=>{if(editing&&confirm('この旅程を削除しますか？')){trips=trips.filter(t=>t.id!==editing);save();closeEditor();goHome();toast('削除しました')}};
$('#ePhoto').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let scale=Math.min(1,1200/img.width,900/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);uploaded=c.toDataURL('image/jpeg',.74);URL.revokeObjectURL(url);toast('写真を選択しました。保存すると表紙になります')}catch(err){toast('写真を読み込めませんでした')}};
$('#addBtn').onclick=()=>openEditor(null);$('#search').oninput=render;
$('#backupBtn').onclick=()=>{let action=prompt('データ管理：\n1 = バックアップを書き出す\n2 = JSONを読み込む\n3 = すべての旅程を消去する\n\n番号を入力してください');if(action==='1'){downloadBackup('FamilyTrips_backup_'+new Date().toISOString().slice(0,10)+'.json')}else if(action==='2')$('#importFile').click();else if(action==='3'&&confirm('全旅程を消去します。バックアップはありますか？')&&confirm('本当に消去しますか？')){trips=[];save();goHome()}};
function downloadBackup(filename){let blob=new Blob([JSON.stringify(trips,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function mergeTrip(current,incoming){
  if(!current)return incoming;
  const merged={...current,...incoming};
  // 表紙は端末で選んだ写真・URLを最優先。新しいJSONの空欄では消さない。
  if(current.cover)merged.cover=current.cover;
  if(current.coverCredit)merged.coverCredit=current.coverCredit;
  // 個別設定した写真アルバムも保持。
  if(current.album)merged.album=current.album;
  // 新JSONが空欄なら、既存のエピソードや元メモを維持する。
  for(const k of ['memory','raw','summary','start','end']){
    if((incoming[k]===undefined||incoming[k]===null||incoming[k]==='')&&current[k])merged[k]=current[k];
  }
  // URLは重複を避けて両方残す。
  const links=[...(current.links||[]),...(incoming.links||[])];
  merged.links=[...new Map(links.filter(l=>l&&l.url).map(l=>[l.url,l])).values()];
  return merged;
}
$('#importFile').onchange=async e=>{
  let f=e.target.files?.[0];if(!f)return;
  try{
    let data=JSON.parse(await f.text());
    if(!Array.isArray(data)||data.some(x=>!x||typeof x.title!=='string'||!x.title.trim()||!x.id))throw Error('JSON形式が違います（idとtitleが必要です）');
    let existing=new Map(trips.map(x=>[x.id,x]));
    let incoming=data.map(normalize);
    let overlapping=incoming.filter(x=>existing.has(x.id)).length;
    let msg=`${incoming.length}件を読み込みます（既存と重複：${overlapping}件）。\n\n・登録済みの表紙写真・写真URL・アルバムリンクは保持\n・新しい旅程と説明文は更新\n・新JSONにない旅行は残す\n・元メモや思い出は新JSONが空欄なら保持\n\n読み込み前に自動でバックアップをダウンロードします。\n続行しますか？`;
    if(!confirm(msg))return;
    downloadBackup('FamilyTrips_import前バックアップ_'+new Date().toISOString().slice(0,10)+'.json');
    for(const t of incoming)existing.set(t.id,mergeTrip(existing.get(t.id),t));
    const previous=trips;
    trips=[...existing.values()];
    if(save()){
      goHome();
      toast(`読み込み完了：更新${overlapping}件・新規${incoming.length-overlapping}件。写真は保持しました`);
    }else trips=previous;
  }catch(err){alert('読み込めませんでした：'+err.message)}
  finally{e.target.value=''}
};
load();render();
</script></body></html>
