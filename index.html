<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>Family Trips</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#24332e;background:#f7f4ee}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:#236b62}header{background:#fffdf9;padding:24px 18px 14px;position:sticky;top:0;z-index:4;border-bottom:1px solid #ebe5da}.wrap{max-width:850px;margin:auto}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:25px;letter-spacing:-.7px}.eyebrow{font-size:11px;color:#8b8c7f;letter-spacing:2px;text-transform:uppercase}.sub{font-size:12px;color:#8b8c7f}.controls{display:flex;gap:9px;margin-top:15px}.search{width:100%;border:1px solid #e1ded4;background:#f9f8f4;border-radius:13px;padding:11px 13px;outline:none}.pill,.btn{border:1px solid #d9ded4;border-radius:999px;padding:9px 13px;background:white;color:#34473e}.btn.primary{background:#28665b;color:white;border-color:#28665b}.filters{display:flex;gap:8px;overflow-x:auto;padding:13px 0 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filters button{white-space:nowrap;border:1px solid #e5e2d8;background:#fff;border-radius:999px;padding:8px 12px;color:#58655d;font-size:12px}.filters button.active{background:#315f56;color:white;border-color:#315f56}main{padding:20px 18px 100px}.count{font-size:12px;color:#8a8b7e;margin-bottom:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}.trip{background:#fffdf9;border:1px solid #ece8df;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px #3d493708;cursor:pointer}.cover{height:155px;background:linear-gradient(120deg,#d9e8d6,#d1ddd5);position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover .fallback{height:100%;display:grid;place-items:center;font-size:44px}.cover small{position:absolute;left:12px;bottom:12px;background:#fffffff0;padding:6px 10px;border-radius:99px;font-size:11px;color:#36564c}.tripbody{padding:16px}.date{font-size:11px;color:#859083}.trip h2{font-size:18px;margin:6px 0 8px}.trip p{font-size:12px;color:#69736a;line-height:1.7;margin:0}.tag{font-size:10px;display:inline-block;background:#edf3ec;color:#547064;padding:5px 8px;border-radius:8px;margin:10px 5px 0 0}.overlay{position:fixed;inset:0;background:#18272091;z-index:10;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:#fffdfa;border-radius:22px 22px 0 0;width:100%;max-width:850px;max-height:94dvh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.sheet-head{position:sticky;top:0;background:#fffdfaed;backdrop-filter:blur(12px);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2;border-bottom:1px solid #ede9df}.detail{padding:18px}.detail h2{font-size:25px;margin:8px 0}.detail .lead{color:#66736a;line-height:1.9}.hero{height:190px;border-radius:17px;overflow:hidden;background:linear-gradient(120deg,#dbe4d7,#e8dfc8);display:grid;place-items:center;margin:14px 0}.hero img{width:100%;height:100%;object-fit:cover}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{border:1px solid #e5e6df;border-radius:10px;background:#fff;padding:10px 14px;font-size:13px}.tabs button.active{background:#2b6659;color:white}.section{margin:20px 0;border-left:3px solid #9dbab0;padding-left:16px}.section h3{font-size:16px;margin:0 0 12px}.timeline{list-style:none;padding:0;margin:0}.timeline li{position:relative;padding:0 0 15px 18px;font-size:14px;line-height:1.65}.timeline li:before{content:'';position:absolute;left:0;top:8px;width:7px;height:7px;background:#9dbab0;border-radius:50%}.links a{display:inline-block;border:1px solid #dce4dc;background:#f7faf5;border-radius:12px;padding:10px 12px;margin:4px 5px 4px 0;text-decoration:none;font-size:13px}.raw{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9;background:#f7f5f0;border-radius:12px;padding:16px}.field{display:block;margin:15px 0;font-size:13px;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #deded6;border-radius:12px;padding:12px;background:white;color:#24332e}.field textarea{min-height:110px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.empty{text-align:center;padding:70px 20px;color:#7a857a}.note{background:#f7f5e9;padding:12px;border-radius:12px;font-size:12px;color:#6b6b55;line-height:1.8}.foot{font-size:11px;color:#8b9287;line-height:1.6;margin-top:14px}@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:90dvh}.cover{height:185px}}
</style></head><body><header><div class="wrap"><div class="brand"><div><div class="eyebrow">Our family journal</div><h1>Family Trips <span style="font-size:19px">✈</span></h1><div class="sub">旅の予定も、家族の思い出も。</div></div><button class="btn primary" onclick="newTrip()">＋ 追加</button></div><div class="controls"><input class="search" id="search" placeholder="旅行先・メモを検索" oninput="render()"><button class="pill" onclick="openTools()">⚙</button></div><div class="filters" id="filters"></div></div></header><main class="wrap"><div class="count" id="count"></div><div class="cards" id="cards"></div></main><div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="sheet-head"><b id="sheetTitle">旅の記録</b><button class="pill" onclick="closeSheet()">閉じる ×</button></div><div class="detail" id="sheetBody"></div></div></div><input type="file" accept="application/json,.json" id="importFile" hidden onchange="importJSON(event)"><script>
'use strict';
const KEY='family-trips-records-v1';const categories=['すべて','ディズニー','テーマパーク','祖父母・親戚','旅行・観光','お出かけ','家族イベント'];let trips=[],filter='すべて',activeId=null,activeTab='整理版';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const datefmt=s=>s?/^\d{4}-\d{2}-\d{2}$/.test(s)?s.replace(/-/g,'.'):s.replace(/-/g,'.'):'日付未設定';const icons={'ディズニー':'🏰','テーマパーク':'🎡','祖父母・親戚':'🏡','旅行・観光':'🧳','お出かけ':'🌿','家族イベント':'🎉'};const validUrl=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function load(){try{trips=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(trips))trips=[]}catch{trips=[]}render()};function save(){localStorage.setItem(KEY,JSON.stringify(trips));render()};function render(){const q=$('search').value.trim().toLowerCase();$('filters').innerHTML=categories.map(c=>`<button class="${filter===c?'active':''}" onclick="chooseFilter('${c}')">${esc(c)}</button>`).join('');let arr=trips.filter(t=>(filter==='すべて'||(t.categories||[t.category]).includes(filter))&&[t.title,t.summary,t.raw,t.notes,JSON.stringify(t.sections||[])].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.start||'').localeCompare(a.start||''));$('count').textContent=`${arr.length}件の旅の記録`; $('cards').innerHTML=arr.length?arr.map(t=>`<article class="trip" onclick="openTrip('${esc(t.id)}')"><div class="cover" id="cover-${esc(t.id)}"><div class="fallback">${icons[t.category]||'🌿'}</div><small>${esc(t.status||'旅の記録')}</small></div><div class="tripbody"><div class="date">${esc(datefmt(t.start))}${t.end&&t.end!==t.start?' 〜 '+esc(datefmt(t.end)):''}</div><h2>${esc(t.title)}</h2><p>${esc(t.summary||'')}</p>${(t.categories||[t.category]).filter(Boolean).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></article>`).join(''):'<div class="empty">まだ記録がありません。<br>⚙ から初期データを読み込めます。</div>';arr.forEach(t=>photo(t,`cover-${t.id}`));}
function chooseFilter(c){filter=c;render()};function show(title,body){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('overlay').classList.add('show');document.body.style.overflow='hidden'}function closeSheet(){$('overlay').classList.remove('show');document.body.style.overflow=''}
function openTrip(id,tab='整理版'){const t=trips.find(x=>x.id===id);if(!t)return;activeId=id;activeTab=tab;const tabs=['整理版','元メモ','写真・リンク'];let body=`<div class="date">${esc(datefmt(t.start))}${t.end&&t.end!==t.start?' 〜 '+esc(datefmt(t.end)):''}</div><h2>${esc(t.title)}</h2><p class="lead">${esc(t.summary)}</p><div class="hero" id="detailPhoto">${icons[t.category]||'🌿'}</div><div class="tabs">${tabs.map(x=>`<button class="${tab===x?'active':''}" onclick="openTrip('${esc(id)}','${x}')">${x}</button>`).join('')}</div>`;
if(tab==='整理版'){body+=(t.sections||[]).length?(t.sections||[]).map(s=>`<section class="section"><h3>${esc(s.title)}</h3><ul class="timeline">${(s.items||[]).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></section>`).join(''):`<p class="raw">${esc(t.summary)}</p>`;if(t.notes)body+=`<p class="note">${esc(t.notes)}</p>`}
if(tab==='元メモ')body+=`<div class="raw">${esc(t.raw||'元メモは未登録です。')}</div>`;
if(tab==='写真・リンク'){body+='<h3>施設・公式サイト</h3><div class="links">'+(t.links||[]).filter(x=>validUrl(x.url)).map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(validUrl(x.url))}">${esc(x.label)} ↗</a>`).join('')+'</div>';body+='<h3>家族の写真アルバム</h3>';body+=validUrl(t.album)?`<div class="links"><a target="_blank" rel="noopener noreferrer" href="${esc(validUrl(t.album))}">写真アルバムを開く ↗</a></div>`:'<p class="sub">アルバムURLは未登録です。編集から追加できます。</p>';body+='<p class="foot">代表画像は施設をイメージする参考写真です。旅行当日に撮影した写真ではありません。画像の出典は画像をタップして確認できます。</p>'}
body+=`<div class="actions"><button class="btn primary" onclick="editTrip('${esc(id)}')">編集</button><button class="btn" onclick="duplicateTrip('${esc(id)}')">複製</button><button class="btn" onclick="deleteTrip('${esc(id)}')">削除</button></div>`;show('旅の記録',body);photo(t,'detailPhoto')}
function photo(t,target){const el=$(target);if(!el)return;if(validUrl(t.photoUrl)){setImage(el,t.photoUrl,t.photoAttribution);return}if(!t.photoQuery)return;lookupCommons(t.photoQuery).then(r=>{if(r&&$(target))setImage($(target),r.url,r.page)}).catch(()=>{})}
function setImage(el,url,page){if(!validUrl(url))return;const img=document.createElement('img');img.alt='旅行先の参考写真';img.loading='lazy';img.onerror=()=>img.remove();img.src=url;el.innerHTML='';if(validUrl(page)){const a=document.createElement('a');a.href=page;a.target='_blank';a.rel='noopener noreferrer';a.title='画像の出典を開く';a.style.cssText='display:block;width:100%;height:100%';a.appendChild(img);el.appendChild(a)}else el.appendChild(img)}
const imageCache=new Map();async function lookupCommons(q){if(imageCache.has(q))return imageCache.get(q);const url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=850&format=json&origin=*';try{const resp=await fetch(url);if(!resp.ok)return null;const json=await resp.json();const pages=Object.values(json.query?.pages||{});const found=pages.find(p=>p.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png|webp)$/i.test(p.title));const value=found?{url:found.imageinfo[0].thumburl,page:found.imageinfo[0].descriptionurl}:null;imageCache.set(q,value);return value}catch{return null}}
function editTrip(id){const t=trips.find(x=>x.id===id);if(!t)return;editor(t)}function newTrip(){editor({id:'trip-'+Date.now(),title:'',start:'',end:'',category:'旅行・観光',categories:['旅行・観光'],summary:'',raw:'',sections:[],links:[],album:'',photoQuery:'',photoUrl:'',status:'計画メモ'})}function editor(t){const c=(t.categories||[t.category]).filter(Boolean);const b=`<form id="editForm" onsubmit="submitTrip(event)"><label class="field">タイトル<input name="title" required value="${esc(t.title)}"></label><label class="field">開始日（年月だけでもOK）<input name="start" value="${esc(t.start)}" placeholder="2026-11-03 / 2023-09"></label><label class="field">終了日<input name="end" value="${esc(t.end)}"></label><label class="field">分類（複数選択可）<div>${categories.slice(1).map(x=>`<label style="display:inline-block;margin:8px 9px 0 0;font-weight:400"><input type="checkbox" name="category" value="${x}" ${c.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></label><label class="field">ひとこと紹介<textarea name="summary">${esc(t.summary)}</textarea></label><label class="field">整理版（1行ごとに時系列の項目。見出しは「# 見出し」）<textarea name="timeline" style="min-height:180px">${esc((t.sections||[]).map(s=>'# '+s.title+'\n'+(s.items||[]).join('\n')).join('\n'))}</textarea></label><label class="field">元メモ<textarea name="raw" style="min-height:150px">${esc(t.raw)}</textarea></label><label class="field">アルバムURL<input name="album" type="url" value="${esc(t.album)}" placeholder="https://..."></label><label class="field">代表画像URL（任意）<input name="photoUrl" type="url" value="${esc(t.photoUrl)}" placeholder="https://..."></label><label class="field">参考写真の検索キーワード<input name="photoQuery" value="${esc(t.photoQuery)}"></label><label class="field">公式サイト（1行に「サイト名 | URL」）<textarea name="links">${esc((t.links||[]).map(x=>x.label+' | '+x.url).join('\n'))}</textarea></label><div class="actions"><button type="submit" class="btn primary">保存する</button><button type="button" class="btn" onclick="openTrip('${esc(t.id)}')">戻る</button></div></form>`;activeId=t.id;show('旅程を編集',b)}
function submitTrip(ev){ev.preventDefault();const f=new FormData(ev.target);const old=trips.find(x=>x.id===activeId)||{id:activeId};const cats=f.getAll('category');const text=String(f.get('timeline')||'');let sections=[];for(const line of text.split('\n')){const s=line.trim();if(!s)continue;if(s.startsWith('#'))sections.push({title:s.replace(/^#+\s*/,''),items:[]});else{if(!sections.length)sections.push({title:'旅の流れ',items:[]});sections.at(-1).items.push(s)}}const links=String(f.get('links')||'').split('\n').map(s=>{const [label,...rest]=s.split('|');return {label:(label||'').trim(),url:rest.join('|').trim()}}).filter(x=>x.label&&validUrl(x.url));const t={...old,title:String(f.get('title')||''),start:String(f.get('start')||''),end:String(f.get('end')||''),categories:cats,category:cats[0]||'旅行・観光',summary:String(f.get('summary')||''),sections,raw:String(f.get('raw')||''),album:String(f.get('album')||''),photoUrl:String(f.get('photoUrl')||''),photoQuery:String(f.get('photoQuery')||''),links};const idx=trips.findIndex(x=>x.id===t.id);if(idx<0)trips.push(t);else trips[idx]=t;save();openTrip(t.id)}
function duplicateTrip(id){const t=trips.find(x=>x.id===id);if(!t)return;const clone=JSON.parse(JSON.stringify(t));clone.id='trip-'+Date.now();clone.title+='（コピー）';trips.push(clone);save();openTrip(clone.id)}function deleteTrip(id){if(!confirm('この旅程を削除しますか？'))return;trips=trips.filter(x=>x.id!==id);save();closeSheet()}
function openTools(){show('データの管理',`<p>旅程はこの端末のブラウザ内に保存されます。GitHubには家族データを公開しません。</p><div class="actions"><button class="btn primary" onclick="$('importFile').click()">初期データ・バックアップを読み込む</button><button class="btn" onclick="exportJSON()">バックアップを書き出す</button></div><p class="note">初期データの読み込みは既存の旅程を同じIDで更新し、追加分は残します。編集したデータを守るため、読み込み前にバックアップを取ってください。Firebase同期は未対応です。</p><p class="foot">参考画像はWikimedia Commonsから検索できた場合のみ表示します。画像は利用条件と出典を確認してください。通信環境によって表示されない場合があります。</p>`)}
function exportJSON(){const blob=new Blob([JSON.stringify(trips,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='family-trips-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function importJSON(ev){const file=ev.target.files?.[0];if(!file)return;try{const arr=JSON.parse(await file.text());if(!Array.isArray(arr)||arr.some(x=>!x||typeof x!=='object'||typeof x.id!=='string'||typeof x.title!=='string'))throw Error('形式が正しくありません');if(!confirm(arr.length+'件を読み込みます。同じIDの既存データは上書きされます。続けますか？'))return;const m=new Map(trips.map(x=>[x.id,x]));arr.forEach(x=>m.set(x.id,x));trips=[...m.values()];save();closeSheet();alert(arr.length+'件を読み込みました')}catch(e){alert('読み込みできませんでした: '+e.message)}finally{ev.target.value=''}}
load();
</script></body></html>
